name: CI

on: 
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  docker:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t heart-disease-api .

      - name: Run Docker container
        run: |
          docker run -d \
            --name heart-disease-api \
            -p 8000:8000 \
            heart-disease-api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/docs > /dev/null; then exit 0
            fi sleep 2 
          done
          docker logs heart-disease-api
          exit 1

      - name: Run API smoke test
        run: python scripts/smoke_test.py

      - name: Stop container
        if: always()
        run: docker rm -f heart-disease-api